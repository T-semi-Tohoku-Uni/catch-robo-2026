pump_controller_node:
  ros__parameters:
    # L/C/Rの順。マイコンではbit0..2=Pump1..3、bit3..5=電磁弁1..3。
    # 実機の配線対応を確認し、必要なら各リストを並べ替える。
    pump_bits: [0, 1, 2]
    valve_bits: [3, 4, 5]

    # 論理ONに対応するCAN指令ビット。GPIOの電圧レベルではない。
    # マイコンは値1→GPIO Low、値0→GPIO High。GPIO Highで通電する解釈を採用。
    pump_on_level: false
    valve_on_level: false

    # 全機構の起動時状態: 開放=-1、オフ=0、吸引=1。
    # mainの起動値56（0b111000、全機構吸引）を維持する。
    initial_state: 1
