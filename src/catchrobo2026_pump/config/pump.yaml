pump_controller_node:
  ros__parameters:
    # L/C/R order. MCU bits 0..2 are pumps, and bits 3..5 are valves.
    # Reorder these lists after confirming the physical wiring.
    pump_bits: [0, 1, 2]
    valve_bits: [3, 4, 5]

    # CAN bit level for logical ON; the MCU maps 1 to GPIO Low and 0 to High.
    pump_on_level: false
    valve_on_level: false

    # Startup state for every collector: release=-1, off=0, suction=1.
    initial_state: 0

    # Pressure sensor array indices in L/C/R order; confirm the physical mapping.
    pressure_indices: [0, 1, 2]
    pressure_threshold: 300
    # Suction succeeds at or above the threshold.
    pressure_comparison: ge
    max_pending_suction_checks: 8
