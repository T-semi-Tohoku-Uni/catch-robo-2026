# Coordinates transcribed from CatchRobo2026_kinematics/config/flange_targets.
# PICK: pick_pose_red.csv; pick_pose_blue.csv has identical coordinates by ID.
# PLACE: shooting_pose_red.csv and shooting_pose_blue.csv, central column.
# Runtime reads this YAML only. Units: mm and rad.
# Relative Z offsets are provisional values for hardware tuning.
version: 1

values:
  # Initial CSV Z values; their physical clearance is not verified.
  work_above_z: 166.95
  common_work_above_z: 186.95
  place_above_z: 294.35
  # Each offset is relative to the last absolute pose, not the preceding move.
  pick_approach_dz: -10
  pick_retreat_dz: 10
  place_approach_dz: -10
  place_retreat_dz: 10

poses:
  # PICK: UI row 0; CSV ID = row * 6 + column + 1.
  pick_0_1_above: [375, 238, '$work_above_z', -1.5707963267949]
  pick_0_2_above: [575, 238, '$work_above_z', -1.5707963267949]
  pick_0_3_above: [775, 238, '$work_above_z', -1.5707963267949]
  pick_0_4_above: [975, 238, '$work_above_z', -1.5707963267949]
  # PICK: UI row 1; CSV ID = row * 6 + column + 1.
  pick_1_1_above: [375, 438, '$work_above_z', -1.5707963267949]
  pick_1_2_above: [575, 438, '$work_above_z', -1.5707963267949]
  pick_1_3_above: [775, 438, '$work_above_z', -1.5707963267949]
  pick_1_4_above: [975, 438, '$work_above_z', -1.5707963267949]
  # PICK: UI row 2; CSV ID = row * 6 + column + 1.
  pick_2_1_above: [375, 638, '$work_above_z', -1.5707963267949]
  pick_2_2_above: [575, 638, '$work_above_z', -1.5707963267949]
  pick_2_3_above: [775, 638, '$work_above_z', -1.5707963267949]
  pick_2_4_above: [975, 638, '$work_above_z', -1.5707963267949]
  # PICK: UI row 3; CSV ID = row * 6 + column + 1.
  pick_3_1_above: [375, 557, '$common_work_above_z', 1.5707963267949]
  pick_3_2_above: [575, 557, '$common_work_above_z', 1.5707963267949]
  pick_3_3_above: [775, 557, '$common_work_above_z', 1.5707963267949]
  pick_3_4_above: [975, 557, '$common_work_above_z', 1.5707963267949]
  # PLACE red: GroupIdx=box+1, RowIdx=box_column+1, ColIdx=2.
  place_red_0_0_above: [114.13, -172, '$place_above_z', -1.5707963267949]
  place_red_0_1_above: [150.87, -286, '$place_above_z', 1.5707963267949]
  place_red_1_0_above: [114.13, -322, '$place_above_z', -1.5707963267949]
  place_red_1_1_above: [150.87, -436, '$place_above_z', 1.5707963267949]
  place_red_2_0_above: [114.13, -472, '$place_above_z', -1.5707963267949]
  place_red_2_1_above: [150.87, -586, '$place_above_z', 1.5707963267949]
  place_red_3_0_above: [114.13, -622, '$place_above_z', -1.5707963267949]
  place_red_3_1_above: [150.87, -736, '$place_above_z', 1.5707963267949]
  # PLACE blue: GroupIdx=box+1, RowIdx=box_column+1, ColIdx=2.
  place_blue_0_0_above: [1235.87, -172, '$place_above_z', -1.5707963267949]
  place_blue_0_1_above: [1199.13, -286, '$place_above_z', 1.5707963267949]
  place_blue_1_0_above: [1235.87, -322, '$place_above_z', -1.5707963267949]
  place_blue_1_1_above: [1199.13, -436, '$place_above_z', 1.5707963267949]
  place_blue_2_0_above: [1235.87, -472, '$place_above_z', -1.5707963267949]
  place_blue_2_1_above: [1199.13, -586, '$place_above_z', 1.5707963267949]
  place_blue_3_0_above: [1235.87, -622, '$place_above_z', -1.5707963267949]
  place_blue_3_1_above: [1199.13, -736, '$place_above_z', 1.5707963267949]

sequences:
  pick_common:
    steps:
      - move: {relative: [0, 0, '$pick_approach_dz', 0]}
      - pump: suction
      - move: {relative: [0, 0, '$pick_retreat_dz', 0]}
      - pump: off
  place_common:
    steps:
      - move: {relative: [0, 0, '$place_approach_dz', 0]}
      - pump: release
      - move: {relative: [0, 0, '$place_retreat_dz', 0]}
      - pump: off

  pick_0_1:
    steps:
      - move: {absolute: pick_0_1_above}
      - call: pick_common
  pick_0_2:
    steps:
      - move: {absolute: pick_0_2_above}
      - call: pick_common
  pick_0_3:
    steps:
      - move: {absolute: pick_0_3_above}
      - call: pick_common
  pick_0_4:
    steps:
      - move: {absolute: pick_0_4_above}
      - call: pick_common
  pick_1_1:
    steps:
      - move: {absolute: pick_1_1_above}
      - call: pick_common
  pick_1_2:
    steps:
      - move: {absolute: pick_1_2_above}
      - call: pick_common
  pick_1_3:
    steps:
      - move: {absolute: pick_1_3_above}
      - call: pick_common
  pick_1_4:
    steps:
      - move: {absolute: pick_1_4_above}
      - call: pick_common
  pick_2_1:
    steps:
      - move: {absolute: pick_2_1_above}
      - call: pick_common
  pick_2_2:
    steps:
      - move: {absolute: pick_2_2_above}
      - call: pick_common
  pick_2_3:
    steps:
      - move: {absolute: pick_2_3_above}
      - call: pick_common
  pick_2_4:
    steps:
      - move: {absolute: pick_2_4_above}
      - call: pick_common
  pick_3_1:
    steps:
      - move: {absolute: pick_3_1_above}
      - call: pick_common
  pick_3_2:
    steps:
      - move: {absolute: pick_3_2_above}
      - call: pick_common
  pick_3_3:
    steps:
      - move: {absolute: pick_3_3_above}
      - call: pick_common
  pick_3_4:
    steps:
      - move: {absolute: pick_3_4_above}
      - call: pick_common
  place_red_0_0:
    steps:
      - move: {absolute: place_red_0_0_above}
      - call: place_common
  place_red_0_1:
    steps:
      - move: {absolute: place_red_0_1_above}
      - call: place_common
  place_red_1_0:
    steps:
      - move: {absolute: place_red_1_0_above}
      - call: place_common
  place_red_1_1:
    steps:
      - move: {absolute: place_red_1_1_above}
      - call: place_common
  place_red_2_0:
    steps:
      - move: {absolute: place_red_2_0_above}
      - call: place_common
  place_red_2_1:
    steps:
      - move: {absolute: place_red_2_1_above}
      - call: place_common
  place_red_3_0:
    steps:
      - move: {absolute: place_red_3_0_above}
      - call: place_common
  place_red_3_1:
    steps:
      - move: {absolute: place_red_3_1_above}
      - call: place_common
  place_blue_0_0:
    steps:
      - move: {absolute: place_blue_0_0_above}
      - call: place_common
  place_blue_0_1:
    steps:
      - move: {absolute: place_blue_0_1_above}
      - call: place_common
  place_blue_1_0:
    steps:
      - move: {absolute: place_blue_1_0_above}
      - call: place_common
  place_blue_1_1:
    steps:
      - move: {absolute: place_blue_1_1_above}
      - call: place_common
  place_blue_2_0:
    steps:
      - move: {absolute: place_blue_2_0_above}
      - call: place_common
  place_blue_2_1:
    steps:
      - move: {absolute: place_blue_2_1_above}
      - call: place_common
  place_blue_3_0:
    steps:
      - move: {absolute: place_blue_3_0_above}
      - call: place_common
  place_blue_3_1:
    steps:
      - move: {absolute: place_blue_3_1_above}
      - call: place_common

bindings:
  red:
    pick:
      '0,1': pick_0_1
      '0,2': pick_0_2
      '0,3': pick_0_3
      '0,4': pick_0_4
      '1,1': pick_1_1
      '1,2': pick_1_2
      '1,3': pick_1_3
      '1,4': pick_1_4
      '2,1': pick_2_1
      '2,2': pick_2_2
