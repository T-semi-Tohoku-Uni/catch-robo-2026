      '3,3': pick_3_3
      '3,4': pick_3_4
    place:
      '0,0': place_red_0_0
      '0,1': place_red_0_1
      '1,0': place_red_1_0
      '1,1': place_red_1_1
      '2,0': place_red_2_0
      '2,1': place_red_2_1
      '3,0': place_red_3_0
      '3,1': place_red_3_1
