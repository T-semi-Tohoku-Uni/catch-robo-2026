  red:
    pick:
      '0,1': pick_0_1
      '0,2': pick_0_2
      '0,3': pick_0_3
      '0,4': pick_0_4
      '1,1': pick_1_1
      '1,2': pick_1_2
      '1,3': pick_1_3
      '1,4': pick_1_4
      '2,1': pick_2_1
      '2,2': pick_2_2
      '2,3': pick_2_3
      '2,4': pick_2_4
      '3,1': pick_3_1
      '3,2': pick_3_2
      '3,3': pick_3_3
      '3,4': pick_3_4
    place:
      '0,0': place_red_0_0
      '0,1': place_red_0_1
      '1,0': place_red_1_0
      '1,1': place_red_1_1
      '2,0': place_red_2_0
