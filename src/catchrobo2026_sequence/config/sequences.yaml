# Sequence configuration guide (full reference: ../CONFIG.md).
# Use spaces for indentation. Each step contains exactly one operation.
#
# Sections:
#   values:    Shared numbers, referenced as '$name' (no expressions).
#   poses:     Named [x, y, z, phi] targets; position in mm, angle in rad.
#   sequences: Named step lists, executed from top to bottom.
#   bindings:  Team-specific UI locations mapped to sequence names.
#              pick: 'row,column'; place: 'box,box_column'; indices start at 0.
#              PICK centers use columns 1..4. A null binding disables a location.
#
# UI lifecycle hooks (values are names under sequences):
#   before_initialization_sequence -> before the initialization command.
#   after_initialization_sequence  -> after the command is accepted.
#   start_sequence                 -> UI Start, before PICK/PLACE processing.
#   end_sequence                   -> UI End, after the active action is canceled.
# Initialization acceptance is not hardware homing completion; add wait if needed.
# End does not run on queue exhaustion, cancel, reset, failure, or Ctrl+C.
#
# Step syntax examples (choose positions and wait times for your hardware):
#   - move: {absolute: lifecycle_pose}
#   - move: {absolute: [670, -110, 220, 0]}
#   - waypoint: {absolute: [675, 200, 300, 0]}
#   - move: {absolute: lifecycle_pose, waypoints: [[675, 200, 300, 0]]}
#   - move: {relative: [0, 0, '$pick_approach_dz', 0]}
#   - pump: suction                 # suction / off / release
#   - endeffector: '$place_endeffector_command'  # 0 or 1; width, not angle
#   - wait: 0.5                     # seconds
#   - call: pick_common             # inline another sequence here
#   - suction_check: {start: {timeout: 2.0}}
#   - suction_check: wait           # save success or timeout for a later IF
#   - if: {condition: suction_success, then: [{break: true}]}
#   - for: {max_iterations: 3, steps: [{wait: 0.5}]}
#   - fail: "Suction failed"
# Match each suction start with wait; BREAK exits the innermost bounded FOR.
# Put conditional branches around complete groups, never inside a preplanned group.
# Relative moves use the last absolute target as a FIXED anchor, not the last move.
# waypoint joins the next MOVE into one route, without an arrival wait here.
# A waypoint-only common sequence can precede a MOVE through call or extends.
# Consecutive waypoints must end in a normal MOVE before any other operation.
# PICK/PLACE trailing waypoints carry to the next PICK/PLACE MOVE in the same epoch.
# Lifecycle actions, reset, failure and cancel discard pending waypoints.
# move.waypoints accepts pose names, [x,y,z,phi], {absolute: ...}, {relative: ...}.
# Inline waypoints run before the move target and do not change its fixed anchor.
# Inline relative entries use the absolute anchor BEFORE this move.
# Legacy move: {absolute: ..., waypoint: true} remains supported.
# Sequence groups preplan a span and keep unwrapped wrist commands:
#   - sequence_group: {start: true, rotation_group: true, max_phi_travel: 1.5707963267948966}
#   - move: {absolute: place_blue_0_0_above}
#   - pump: release
#   - wait: 0.5
#   - move: {relative: [0, 0, '$place_retreat_dz', 0]}
#   - sequence_group: end
# rotation_group: true selects a single physical wrist direction within [-2*pi, 0].
# Omit rotation_group to allow wrist reversal while retaining unwrapped commands.
# max_phi_travel bounds SUM(abs(delta(q0 + q4))) in radians, not endpoint yaw difference.
# Omit max_phi_travel for no total-yaw limit; zero requests constant world-frame phi.
# The limit spans all moves, including travel from the group start to its first target.
# The whole group is planned before its first operation; infeasible groups fail.
# Match start/end after call/extends expansion; no nesting or movement-free groups.
# A group cannot cross a UI action or initialization hook, or split a waypoint route.
# Put start before the first waypoint and end after its final normal MOVE.
# Legacy rotation_group: start/end is equivalent to a group with rotation_group: true.
# Ending below limits phi travel only from A to B to 30 degrees.
# Each lifecycle hook needs its own absolute anchor before any relative move.
# PICK/PLACE pumps use the UI-selected collectors; other collectors receive off.
# Lifecycle pump steps address all three collectors.
#
# Reuse:
#   poses: {alias: lifecycle_pose, raised: {extends: lifecycle_pose, z: 250}}
#   sequences: {alias: ending, combined: {extends: ending, steps: [{wait: 0.5}]}}
# Sequence extends runs parent steps first, then appends its own steps.
#
# Disable all steps with an EMPTY LIST, not a bare "steps:" (which is null):
#   after_initialization:
#     steps: []
#     # - move: {absolute: lifecycle_pose}
# When restoring the move, change "steps: []" back to "steps:" and uncomment it.
# A lifecycle hook reference may be omitted or null, but every sequence definition
# is still validated. Do not leave null steps or references to deleted definitions.
# PICK/PLACE bindings must expand to at least one step; use a null binding to disable.
#
# Reload: debug:=true reloads this file before each action, never during an action.
# Otherwise restart the node after edits. Set sequence_file to the file being edited;
# if using the installed copy, rebuild to copy source edits into install/.
#
# Coordinates transcribed from CatchRobo2026_kinematics/config/flange_targets.
# PICK: pick_pose_red.csv; pick_pose_blue.csv has identical coordinates by ID.
# PLACE: shooting_pose_red.csv and shooting_pose_blue.csv, central column.
# Runtime reads this YAML only. Units: mm and rad.
# Relative Z offsets are provisional values for hardware tuning.
version: 1

# Timeout for one followed route, including its waypoints (seconds).
# Overrides the ROS parameter; debug mode reloads it before each action.
# The separate sequence_timeout_sec ROS parameter still limits the whole action.
route_timeout_sec: 30.0

before_initialization_sequence: before_initialization
after_initialization_sequence: after_initialization
start_sequence: startup
end_sequence: ending

values:
  # Provisional width commands; confirm the 0/1 mapping on hardware.
  pick_endeffector_command: 1
  place_endeffector_command: 0
  # Initial CSV Z values; their physical clearance is not verified.
  work_above_z: 226.95
  common_work_above_z: 246.95
  place_above_z: 354.35
  # Each offset is relative to the last absolute pose, not the preceding move.
  pick_approach_dz: -60
  pick_retreat_dz: 60
  # Experimental retry settings; confirm pressure_comparison/indices in pump.yaml first.
  pick_max_attempts: 3
  pick_suction_timeout_sec: 2.0
  place_approach_dz: -60
  place_retreat_dz: 0

poses:
  lifecycle_pose: [670, -110, 220, 0]
  # PICK: UI row 0; CSV ID = row * 6 + column + 1.
  pick_0_1_above: [375, 238, '$work_above_z', -3.14159265358979]
  pick_0_2_above: [575, 238, '$work_above_z', -3.14159265358979]
  pick_0_3_above: [775, 238, '$work_above_z', -3.14159265358979]
  pick_0_4_above: [975, 238, '$work_above_z', -3.14159265358979]
  # PICK: UI row 1; CSV ID = row * 6 + column + 1.
  pick_1_1_above: [375, 438, '$work_above_z', -3.14159265358979]
  pick_1_2_above: [575, 438, '$work_above_z', -3.14159265358979]
  pick_1_3_above: [775, 438, '$work_above_z', -3.14159265358979]
  pick_1_4_above: [975, 438, '$work_above_z', -3.14159265358979]
  # PICK: UI row 2; CSV ID = row * 6 + column + 1.
  pick_2_1_above: [375, 638, '$work_above_z', -3.14159265358979]
  pick_2_2_above: [575, 638, '$work_above_z', -3.14159265358979]
  pick_2_3_above: [775, 638, '$work_above_z', -3.14159265358979]
  pick_2_4_above: [975, 638, '$work_above_z', -3.14159265358979]
  # PICK: UI row 3; CSV ID = row * 6 + column + 1.
  pick_3_1_above: [375, 557, '$common_work_above_z', 3.14159265358979]
  pick_3_2_above: [575, 557, '$common_work_above_z', 3.14159265358979]
  pick_3_3_above: [775, 557, '$common_work_above_z', 3.14159265358979]
  pick_3_4_above: [975, 557, '$common_work_above_z', 3.14159265358979]
  # PLACE red: GroupIdx=box+1, RowIdx=box_column+1, ColIdx=2.
  place_red_0_0_above: [114.13, -172, '$place_above_z', -3.14159265358979]
  place_red_0_1_above: [150.87, -286, '$place_above_z', 3.14159265358979]
  place_red_1_0_above: [114.13, -322, '$place_above_z', -3.14159265358979]
  place_red_1_1_above: [150.87, -436, '$place_above_z', 3.14159265358979]
  place_red_2_0_above: [114.13, -472, '$place_above_z', -3.14159265358979]
  place_red_2_1_above: [150.87, -586, '$place_above_z', 3.14159265358979]
  place_red_3_0_above: [114.13, -622, '$place_above_z', -3.14159265358979]
  place_red_3_1_above: [150.87, -736, '$place_above_z', 3.14159265358979]
  # PLACE blue: GroupIdx=box+1, RowIdx=box_column+1, ColIdx=2.
  place_blue_0_0_above: [1235.87, -172, '$place_above_z', -3.14159265358979]
  place_blue_0_1_above: [1199.13, -286, '$place_above_z', 3.14159265358979]
  place_blue_1_0_above: [1235.87, -322, '$place_above_z', -3.14159265358979]
  place_blue_1_1_above: [1199.13, -436, '$place_above_z', 3.14159265358979]
  place_blue_2_0_above: [1235.87, -472, '$place_above_z', -3.14159265358979]
  place_blue_2_1_above: [1199.13, -586, '$place_above_z', 3.14159265358979]
  place_blue_3_0_above: [1235.87, -622, '$place_above_z', -3.14159265358979]
  place_blue_3_1_above: [1199.13, -736, '$place_above_z', 3.14159265358979]

sequences:
  # Initialization and ending share the same target pose.
  before_initialization:
    steps: []
    # - move: {absolute: lifecycle_pose}
  after_initialization:
    steps: []
    # - move: {absolute: lifecycle_pose}
  ending:
    steps:
      - sequence_group: start
      - move: {absolute: [675, 200, 300, 0]}
      - phi_travel: {start: true, limit: 0.5235987755982988}  # 30 degrees, A to B only.
      - move: {absolute: lifecycle_pose}
      - phi_travel: end
      - sequence_group: end
  startup:
    steps:
      - endeffector: '$place_endeffector_command'
  pick_common:
    # Keep exactly one call active. Comment the experimental call to restore normal PICK.
    # Swap these two comment markers to enable the experiment; no reindentation needed.
    steps:
      - call: pick_without_suction_check
      # - call: pick_with_suction_check
  pick_without_suction_check:
    steps:
      - call: pick_attempt
      - endeffector: '$place_endeffector_command'
  pick_with_suction_check:
    steps:
      - for:
          max_iterations: '$pick_max_attempts'
          steps:
            - suction_check: {start: {timeout: '$pick_suction_timeout_sec'}}
            - call: pick_attempt
            - suction_check: wait
            - if:
                condition: suction_success
                then:
                  - break: true
      - if:
          condition: suction_failure
          then:
            - fail: "Suction failed after the maximum number of attempts"
      - endeffector: '$place_endeffector_command'
  pick_attempt:
    # Shared motion preserves the current approach, Y correction, suction and retreat order.
    steps:
      - move: {relative: [0, 0, '$pick_approach_dz', 0]}
      - move: {relative: [0, -10, '$pick_approach_dz', 0]}
      - pump: suction
      - move: {relative: [0, 0, '$pick_retreat_dz', 0]}
  place_common:
    steps:
      - pump: release
      - move: {relative: [0, 0, '$place_approach_dz', 0]}
      - move: {relative: [0, 0, '$place_retreat_dz', 0]}
      - pump: off
      - endeffector: '$pick_endeffector_command'
  place_pre_red_waypoint:
    steps:
      - waypoint: {absolute: [150, 0, 360, 3.14159265358979]}
  place_pre_blue_waypoint:
    steps:
      - waypoint: {absolute: [1200, 0, 360, 3.14159265358979]}

  pick_0_1:
    steps:
      - move: {absolute: pick_0_1_above}
      - call: pick_common
  pick_0_2:
    steps:
      - move: {absolute: pick_0_2_above}
      - call: pick_common
  pick_0_3:
    steps:
      - move: {absolute: pick_0_3_above}
      - call: pick_common
  pick_0_4:
    steps:
      - move: {absolute: pick_0_4_above}
      - call: pick_common
  pick_1_1:
    steps:
      - move: {absolute: pick_1_1_above}
      - call: pick_common
  pick_1_2:
    steps:
      - move: {absolute: pick_1_2_above}
      - call: pick_common
  pick_1_3:
    steps:
      - move: {absolute: pick_1_3_above}
      - call: pick_common
  pick_1_4:
    steps:
      - move: {absolute: pick_1_4_above}
      - call: pick_common
  pick_2_1:
    steps:
      - move: {absolute: pick_2_1_above}
      - call: pick_common
  pick_2_2:
    steps:
      - move: {absolute: pick_2_2_above}
      - call: pick_common
  pick_2_3:
    steps:
      - move: {absolute: pick_2_3_above}
      - call: pick_common
  pick_2_4:
    steps:
      - move: {absolute: pick_2_4_above}
      - call: pick_common
  pick_3_1:
    steps:
      - move: {absolute: pick_3_1_above}
      - call: pick_common
  pick_3_2:
    steps:
      - move: {absolute: pick_3_2_above}
      - call: pick_common
  pick_3_3:
    steps:
      - move: {absolute: pick_3_3_above}
      - call: pick_common
  pick_3_4:
    steps:
      - move: {absolute: pick_3_4_above}
      - call: pick_common
  place_red_0_0:
    steps:
      - call: place_pre_red_waypoint
      - move: {absolute: place_red_0_0_above}
      - call: place_common
      - call: place_pre_red_waypoint
  place_red_0_1:
    steps:
      - call: place_pre_red_waypoint
      - move: {absolute: place_red_0_1_above}
      - call: place_common
      - call: place_pre_red_waypoint
  place_red_1_0:
    steps:
      - call: place_pre_red_waypoint
      - move: {absolute: place_red_1_0_above}
      - call: place_common
      - call: place_pre_red_waypoint
  place_red_1_1:
    steps:
      - call: place_pre_red_waypoint
      - move: {absolute: place_red_1_1_above}
      - call: place_common
      - call: place_pre_red_waypoint
  place_red_2_0:
    steps:
      - call: place_pre_red_waypoint
      - move: {absolute: place_red_2_0_above}
      - call: place_common
      - call: place_pre_red_waypoint
  place_red_2_1:
    steps:
      - call: place_pre_red_waypoint
      - move: {absolute: place_red_2_1_above}
      - call: place_common
      - call: place_pre_red_waypoint
  place_red_3_0:
    steps:
      - call: place_pre_red_waypoint
      - move: {absolute: place_red_3_0_above}
      - call: place_common
      - call: place_pre_red_waypoint
  place_red_3_1:
    steps:
      - call: place_pre_red_waypoint
      - move: {absolute: place_red_3_1_above}
      - call: place_common
      - call: place_pre_red_waypoint
  place_blue_0_0:
    steps:
      - call: place_pre_blue_waypoint
      - move: {absolute: place_blue_0_0_above}
      - call: place_common
      - call: place_pre_blue_waypoint
  place_blue_0_1:
    steps:
      - call: place_pre_blue_waypoint
      - move: {absolute: place_blue_0_1_above}
      - call: place_common
      - call: place_pre_blue_waypoint
  place_blue_1_0:
    steps:
      - call: place_pre_blue_waypoint
      - move: {absolute: place_blue_1_0_above}
      - call: place_common
      - call: place_pre_blue_waypoint
  place_blue_1_1:
    steps:
      - call: place_pre_blue_waypoint
      - move: {absolute: place_blue_1_1_above}
      - call: place_common
      - call: place_pre_blue_waypoint
  place_blue_2_0:
    steps:
      - call: place_pre_blue_waypoint
      - move: {absolute: place_blue_2_0_above}
      - call: place_common
      - call: place_pre_blue_waypoint
  place_blue_2_1:
    steps:
      - call: place_pre_blue_waypoint
      - move: {absolute: place_blue_2_1_above}
      - call: place_common
      - call: place_pre_blue_waypoint
  place_blue_3_0:
    steps:
      - call: place_pre_blue_waypoint
      - move: {absolute: place_blue_3_0_above}
      - call: place_common
      - call: place_pre_blue_waypoint
  place_blue_3_1:
    steps:
      - call: place_pre_blue_waypoint
      - move: {absolute: place_blue_3_1_above}
      - call: place_common
      - call: place_pre_blue_waypoint

bindings:
  red:
    pick:
      '0,1': pick_0_1
      '0,2': pick_0_2
      '0,3': pick_0_3
      '0,4': pick_0_4
      '1,1': pick_1_1
      '1,2': pick_1_2
      '1,3': pick_1_3
      '1,4': pick_1_4
      '2,1': pick_2_1
      '2,2': pick_2_2
      '2,3': pick_2_3
      '2,4': pick_2_4
      '3,1': pick_3_1
      '3,2': pick_3_2
      '3,3': pick_3_3
      '3,4': pick_3_4
    place:
      '0,0': place_red_0_0
      '0,1': place_red_0_1
      '1,0': place_red_1_0
      '1,1': place_red_1_1
      '2,0': place_red_2_0
      '2,1': place_red_2_1
      '3,0': place_red_3_0
      '3,1': place_red_3_1
  blue:
