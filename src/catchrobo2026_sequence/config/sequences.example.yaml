# Festival lifecycle only. Position: mm; phi is ignored at runtime.
# Every MOVE preserves the latest measured phi at action start.
version: 1
route_timeout_sec: 180.0
before_initialization_sequence: before_initialization
after_initialization_sequence: after_initialization
start_sequence: startup
end_sequence: ending
values:
  # Width command retained from the existing startup sequence.
  startup_width_command: 1
poses:
  lifecycle_pose: [675, -110, 220, 0]
sequences:
  before_initialization:
    steps: []
  after_initialization:
    steps: []
  startup:
    steps:
      - endeffector: '$startup_width_command'
  ending:
    steps:
      - move: {absolute: [675, 400, 300, 0]}
      - move: {absolute: lifecycle_pose}
bindings:
  red: {pick: {}, place: {}}
  blue: {pick: {}, place: {}}
