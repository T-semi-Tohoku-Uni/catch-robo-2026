# Illustrative syntax only; these numbers are not robot coordinates.
# Replace the empty maps above; do not append duplicate keys.
# values:
#   work_above_z: 300
#   shared_above_z: '$work_above_z'
#   grip_depth: -20
#   grip_wait: 0.2
# poses:
#   red_work_0_1: [100, 200, '$shared_above_z', 0]
#   red_work_0_2: {extends: red_work_0_1, y: 250}
#   red_box_0_0: [200, 100, '$shared_above_z', 0]
# sequences:
#   grip_normal:
#     steps:
#       - move: {relative: [0, 0, '$grip_depth', 0]}
#       - pump: suction
#       - wait: '$grip_wait'
#       - move: {relative: [0, 0, 0, 0]}
#   grip_front: grip_normal
#   grip_other:
#     steps:
#       - endeffector: 1
#       - call: grip_normal
#   approach_0_1:
#     steps:
#       - move: {absolute: red_work_0_1}
#   red_pick_0_1:
#     extends: approach_0_1
#     steps:
#       - call: grip_front
#   red_pick_0_2:
#     steps:
#       - move: {absolute: red_work_0_2}
#       - call: grip_other
#   red_place_0_0:
#     steps:
#       - move: {absolute: red_box_0_0}
#       - pump: release
#       - wait: '$grip_wait'
#       - pump: off
# Bind e.g. bindings.red.pick.'0,1' to red_pick_0_1 after calibration.
